services:

  postgres:
    image: postgres:16-alpine
    container_name: fn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-fn}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ultraviolence}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-fn}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fn-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: fn-ml-service
    restart: unless-stopped
    environment:
      BERT_MODEL_NAME: Juanillaberia/spanish-fake-news-classifier
      HF_HUB_ENABLE_HF_TRANSFER: "0"
    ports:
      - "${ML_SERVICE_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  ocr-service:
    build:
      context: ./ocr_service
      dockerfile: Dockerfile
    container_name: fn-ocr-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OCR_SERVICE_PORT:-8002}:8000"
    volumes:
      - paddleocr_cache_v2:/home/appuser/.paddlex
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s

volumes:
  postgres_data:
  redis_data:
  paddleocr_cache_v2: