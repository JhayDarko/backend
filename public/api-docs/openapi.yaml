openapi: 3.0.3
info:
  title: FactNode API pública
  version: "1.0"
  description: |
    Analiza noticias y consulta veredictos de credibilidad.
    Autenticación con `X-API-Key` (crea tu clave en la app, sección "API"). Planes: gratuito (10 req/min, 10 análisis/día) y Pro (60 req/min, 300 análisis/día).
servers:
  - url: /api/public/v1
security:
  - ApiKey: []
paths:
  /analyses:
    post:
      summary: Inicia el análisis de una noticia (URL o texto)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, format: uri, example: "https://example.com/noticia" }
                content: { type: string, minLength: 30, maxLength: 65000 }
                title: { type: string }
      responses:
        "202": { description: Análisis creado y en cola }
        "200": { description: Ya existía un análisis de esa noticia para tu cuenta }
        "401": { description: API key inválida }
        "422": { description: Datos inválidos }
        "429": { description: Límite por minuto o cuota diaria excedidos }
  /analyses/{id}:
    get:
      summary: Informe completo (score, veredicto, claims y evidencias)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK }, "403": { description: No es tu análisis } }
  /analyses/{id}/status:
    get:
      summary: Estado y progreso (para polling)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: "status, step, progress 0-100" } }
  /analyses/{id}/report/json:
    get:
      summary: Informe descargable en JSON (solo análisis completados)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK }, "409": { description: Aún no termina } }
  /analyses/{id}/report/pdf:
    get:
      summary: Informe descargable en PDF (solo análisis completados)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: application/pdf }, "409": { description: Aún no termina } }
  /usage:
    get:
      summary: Consumo de hoy y límites de tu plan
      responses: { "200": { description: OK } }
components:
  securitySchemes:
    ApiKey: { type: apiKey, in: header, name: X-API-Key }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer } }
